server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        resolver 127.0.0.11 10.89.0.1 valid=30s;
        set $relay_api http://relay-gpio:8080;
        proxy_pass $relay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
