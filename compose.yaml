services:
  relay-gpio:
    image: ghcr.io/fyrastack/k3-utils/relay-gpio:main
    container_name: relay-gpio
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
    environment:
      GPIO_CHIP: /dev/gpiochip0
      RELAY_ACTIVE_LOW: "1"
      RELAY_HTTP_PORT: "8080"
      RELAY_1_LINE: "0"
      RELAY_2_LINE: "1"
      RELAY_3_LINE: "2"
      RELAY_4_LINE: "3"
