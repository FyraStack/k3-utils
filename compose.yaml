services:
  relay-gpio:
    image: ghcr.io/fyrastack/k3-utils/relay-gpio:main
    container_name: relay-gpio
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
    environment:
      GPIO_CHIP: /dev/gpiochip0
      RELAY_ACTIVE_LOW: "1"
      RELAY_HTTP_PORT: "8080"
      # Relay board IN1..IN4: GPIO17/27/22/23 (physical pins 11/13/15/16).
      RELAY_1_LINE: "17"
      RELAY_2_LINE: "27"
      RELAY_3_LINE: "22"
      RELAY_4_LINE: "23"
