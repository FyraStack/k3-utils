name: relay-gpio CI

"on":
  push:
    paths:
      - "relay-gpio/**"
      - ".github/workflows/relay-gpio-ci.yml"
  pull_request:
    paths:
      - "relay-gpio/**"
      - ".github/workflows/relay-gpio-ci.yml"

permissions:
  contents: read
  security-events: write

jobs:
  format-and-lint:
    name: Format and static analysis
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: relay-gpio
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang-format \
            clang-tidy \
            g++ \
            libgpiod-dev \
            meson \
            ninja-build \
            pkg-config \
            mold

      - name: Check formatting
        run: |
          find . -path ./build -prune -o \
            -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror

      - name: Configure Meson
        run: meson setup build -Dbuildtype=debug -Dcpp_args=-Werror

      - name: Build
        run: meson compile -C build

      - name: Run clang-tidy and generate SARIF
        id: clang-tidy
        continue-on-error: true
        run: |
          python3 clang_tidy_sarif.py \
            --clang-tidy clang-tidy \
            --build-dir build \
            --source-root . \
            --output build/clang-tidy.sarif \
            main.cpp configuration.cpp relay_controller.cpp http_server.cpp

      - name: Upload clang-tidy SARIF
        if: always() && hashFiles('relay-gpio/build/clang-tidy.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: relay-gpio/build/clang-tidy.sarif
          category: clang-tidy

      - name: Fail if clang-tidy found issues
        if: steps.clang-tidy.outcome == 'failure'
        run: exit 1
