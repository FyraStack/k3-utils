name: relay-gpio CI

"on":
  push:
    paths:
      - "relay-gpio/**"
      - ".github/workflows/relay-gpio-ci.yml"
  pull_request:
    paths:
      - "relay-gpio/**"
      - ".github/workflows/relay-gpio-ci.yml"

permissions:
  contents: read

jobs:
  format-and-lint:
    name: Format and static analysis
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: relay-gpio
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang-format \
            clang-tidy \
            g++ \
            libgpiod-dev \
            meson \
            ninja-build \
            pkg-config \
            mold

      - name: Check formatting
        run: |
          find . -path ./build -prune -o \
            -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror

      - name: Configure Meson
        run: meson setup build -Dbuildtype=debug -Dcpp_args=-Werror

      - name: Build
        run: meson compile -C build

      - name: Run clang-tidy
        run: |
          find . -path ./build -prune -o \
            -type f -name '*.cpp' -print0 \
            | xargs -0 -r clang-tidy -p build --warnings-as-errors='*'
